<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#18262a"/><title>포켓몬스터 · 첫 번째 파트너</title></head>
<body><main class="app"><header><span class="brand"><i class="pokeball"></i> POKÉMON <span>첫 번째 파트너</span></span><div class="header-actions"><button id="sound" aria-label="소리 켜기">소리 OFF</button><button id="fullscreen" aria-label="전체 화면">전체 화면 ↗</button></div></header>
<div class="play-layout"><section class="console" aria-label="포켓몬 팬게임"><div class="screen-frame"><canvas id="field" width="256" height="192" tabindex="0" aria-label="게임 화면. 방향키로 이동, Z로 대화, X로 메뉴, M으로 지도"></canvas></div><div class="hinge"><span></span><b>FIRST PARTNER</b><i></i></div><div class="screen-frame bottom"><canvas id="touch" width="256" height="192" tabindex="0" aria-label="터치 화면. 메뉴와 포켓몬 선택"></canvas><div id="a11y" class="sr-only" aria-live="polite"></div></div></section><aside id="test-panel" aria-label="플레이 테스트 및 세이브 관리"></aside></div>
<footer><span><kbd>↑↓←→</kbd> 이동</span><span><kbd>Z</kbd> 확인 / 대화</span><span><kbd>X</kbd> 메뉴 / 취소</span><span><kbd>Shift</kbd> 달리기</span><span><kbd>M</kbd> 지도</span><button id="help">조작 안내</button></footer>
<div class="mobile-controls"><div class="dpad"><button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><div class="action-buttons"><button data-key="x">X</button><button data-key="Shift">B</button><button data-key="z">A</button></div></div>
<p class="credit">개인 팬게임 프로토타입 · Pokémon © Nintendo / Creatures / GAME FREAK</p></main><script type="module" src="/src/main.ts"></script></body></html>
