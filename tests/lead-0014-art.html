<!doctype html><html lang="ko"><meta charset="utf-8"><title>4기술 UI fixture</title><style>@font-face{font-family:Galmuri;src:url('/assets/Galmuri11.woff2')}body{background:#35434b;color:#fff;font-family:Galmuri,sans-serif}canvas{width:512px;height:384px;image-rendering:pixelated;display:block;margin:10px 0;border:5px solid #849b9b}button{padding:10px;margin:4px}#screens{display:flex;gap:20px}</style><p>lead-0014 UI fixture · 실제 renderer / Engine · 자연 진행 검증과 별도</p><button id="summary">정보 화면</button><button id="battle">전투 기술</button><button id="party">교대 비교</button><button id="school">기술 비교</button><div id="screens"><canvas id="field" width="256" height="192" tabindex="0"></canvas><canvas id="touch" width="256" height="192"></canvas></div><pre id="status"></pre><script type="module">
import {Engine} from '/src/engine.ts';import {Renderer} from '/src/renderer.ts';import {createBattle} from '/src/battle.ts';import {showMoveSchool} from '/src/move-school.ts';import fixture from './lead-0014-art-save.json';
if(new URLSearchParams(location.search).get('qa')!=='lead-0014-art')throw Error('QA key required');
const g=new Engine(),f=document.querySelector('#field'),t=document.querySelector('#touch'),r=new Renderer(g,f,t);
function mode(name){g.restore(structuredClone(fixture));g.panel='summary';if(name==='battle'||name==='party'){g.battle=createBattle(g.save,'wild','roark',()=>0);g.battle.menu=name==='party'?'party':'moves';}if(name==='school')showMoveSchool(g,0,'불꽃세례');f.focus();}
for(const name of ['summary','battle','party','school'])document.querySelector('#'+name).onclick=()=>mode(name);
t.onpointerdown=e=>{const b=t.getBoundingClientRect();r.click((e.clientX-b.left)*256/b.width,(e.clientY-b.top)*192/b.height);f.focus()};f.onkeydown=e=>{e.preventDefault();g.press(e.key)};f.onkeyup=e=>g.release(e.key);
await r.load();mode('battle');let previous=performance.now();function draw(now){g.update((now-previous)/1000);previous=now;r.draw();document.querySelector('#status').textContent=JSON.stringify({menu:g.battle?.menu,selected:g.battle?.selected,moves:g.save.party[0].moves,dialogue:g.dialogue?.pages[g.dialogue.page]});requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
